name: biblioteca

# Kafka (L9): bloques copiados de ep3/plataforma-kafka/compose.yml, sin su linea `name:`.
# Los clientes en el equipo usan localhost:9092,localhost:9094,localhost:9096.
# Los contenedores de esta red usan broker-1:19092,broker-2:19092,broker-3:19092.
x-kafka: &kafka
  image: apache/kafka:4.4.0
  restart: unless-stopped

x-controller-env: &controller-env
  CLUSTER_ID: QmlibGlvdGVjYS1LYWZrYQ
  KAFKA_PROCESS_ROLES: controller
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
  # Con KRaft el controller fija el min.insync.replicas por defecto de todo el clúster con su propio
  # valor (1 si no se dice). Sin esta línea, __consumer_offsets y todo topic creado sin la config quedan con 1.
  KAFKA_MIN_INSYNC_REPLICAS: 2

x-broker-env: &broker-env
  CLUSTER_ID: QmlibGlvdGVjYS1LYWZrYQ
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  # Los topics se crean desde kafka/topics.sh, nunca al vuelo.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # Topics internos con 3 copias (el ejemplo oficial trae 1).
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

x-controller-salud: &controller-salud
  test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9093"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbit1:
    image: rabbitmq:4.3-management
    container_name: rabbit1
    hostname: rabbit1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - datos-rabbit:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - ./rabbitmq/politicas.json:/etc/rabbitmq/politicas.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  rabbit2:
    image: rabbitmq:4.3-management
    container_name: rabbit2
    hostname: rabbit2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - datos-rabbit2:/var/lib/rabbitmq
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  eventos:
    build: ../biblioteca-eventos
    init: true
    env_file: ../biblioteca-eventos/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbit1:5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      KAFKA_BROKERS: broker-1:19092,broker-2:19092,broker-3:19092
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      rabbit1:
        condition: service_healthy
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/salud').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  libros:
    build: ../biblioteca-libros
    init: true
    # L10: publica el catalogo en biblioteca.catalogo (compactado) al arrancar y cuando cambia catalogo.json.
    environment:
      KAFKA_BROKERS: broker-1:19092,broker-2:19092,broker-3:19092
    ports:
      - "3001:3001"
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/libros').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  prestamos:
    build: ../biblioteca-prestamos
    init: true
    env_file: ../biblioteca-prestamos/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbit1:5672
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      KAFKA_BROKERS: broker-1:19092,broker-2:19092,broker-3:19092
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbit1:
        condition: service_healthy
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/prestamos').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build: ../biblioteca-admin
    init: true
    env_file: ../biblioteca-admin/.env
    environment:
      RABBIT_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbit1:5672
      RABBIT_ADMIN_URL: http://rabbit1:15672
      RABBIT_USUARIO: ${RABBITMQ_USER}
      RABBIT_CLAVE: ${RABBITMQ_PASSWORD}
    ports:
      - "3020:3020"
    depends_on:
      rabbit1:
        condition: service_healthy
    healthcheck:
      # Todas las rutas del administrador exigen token: se comprueba que el puerto este abierto.
      test: ["CMD", "node", "-e", "process.getBuiltinModule('node:net').connect(3020, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  bff:
    build: ../biblioteca-bff
    init: true
    env_file: ../biblioteca-bff/.env
    environment:
      LIBROS_URL: http://libros:3001
      PRESTAMOS_URL: http://prestamos:3002
      # L10: el panel en vivo lo sirve biblioteca-eventos, dueno de kpi_minuto y alertas.
      EVENTOS_URL: http://eventos:3010
    ports:
      - "3000:3000"

  gateway:
    build: ../biblioteca-gateway
    init: true
    env_file: ../biblioteca-gateway/.env
    environment:
      BFF_URL: http://bff:3000
      LIBROS_URL: http://libros:3001
      PRESTAMOS_URL: http://prestamos:3002
    ports:
      - "8080:8080"

  web:
    build: ../biblioteca-web
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

  controller-1:
    <<: *kafka
    hostname: controller-1
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1
    volumes: [controller-1:/var/lib/kafka/data]
    healthcheck: *controller-salud

  controller-2:
    <<: *kafka
    hostname: controller-2
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 2
    volumes: [controller-2:/var/lib/kafka/data]
    healthcheck: *controller-salud

  controller-3:
    <<: *kafka
    hostname: controller-3
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 3
    volumes: [controller-3:/var/lib/kafka/data]
    healthcheck: *controller-salud

  broker-1:
    <<: *kafka
    hostname: broker-1
    ports: ["9092:9092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_LISTENERS: INTERNO://:19092,EXTERNO://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNO://broker-1:19092,EXTERNO://localhost:9092
    volumes: [broker-1:/var/lib/kafka/data]
    healthcheck: &broker-salud
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/19092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on: &controllers
      controller-1: { condition: service_healthy }
      controller-2: { condition: service_healthy }
      controller-3: { condition: service_healthy }

  broker-2:
    <<: *kafka
    hostname: broker-2
    ports: ["9094:9094"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 5
      KAFKA_LISTENERS: INTERNO://:19092,EXTERNO://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNO://broker-2:19092,EXTERNO://localhost:9094
    volumes: [broker-2:/var/lib/kafka/data]
    healthcheck: *broker-salud
    depends_on: *controllers

  broker-3:
    <<: *kafka
    hostname: broker-3
    ports: ["9096:9096"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 6
      KAFKA_LISTENERS: INTERNO://:19092,EXTERNO://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNO://broker-3:19092,EXTERNO://localhost:9096
    volumes: [broker-3:/var/lib/kafka/data]
    healthcheck: *broker-salud
    depends_on: *controllers

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: biblioteca-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      JAVA_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    depends_on:
      broker-1: { condition: service_healthy }
      broker-2: { condition: service_healthy }
      broker-3: { condition: service_healthy }

volumes:
  datos-postgres:
    name: datos-postgres
  datos-rabbit:
    name: datos-rabbit
  datos-rabbit2:
    name: datos-rabbit2
  controller-1:
  controller-2:
  controller-3:
  broker-1:
  broker-2:
  broker-3:
